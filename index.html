<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Laporan Elitech</title>
<script>
  /* tema: kunci dan cara kerja sama dengan laporan.html */
  (function () {
    var d = document.documentElement;
    function pref() { try { return localStorage.getItem('elitech_theme') || 'auto'; } catch (e) { return 'auto'; } }
    function resolve(p) { return p === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p; }
    d.setAttribute('data-theme', resolve(pref()) === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--brand:#364fab;--brand-soft:#eef0f9;--surface:#f5f6f9;--bg:#fff;--card:#fff;--text:#14151a;--text-2:#6b7280;--border:#e6e8ee;--dur:1s}
  :root[data-theme="dark"]{color-scheme:dark;--brand:#8da2f7;--brand-soft:#222a4a;--surface:#1e2230;--bg:#0f1117;--card:#171a23;--text:#e8eaf0;--text-2:#a3a9b8;--border:#2c3142}
  @media (prefers-reduced-motion:reduce){:root{--dur:.01ms}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}

  .bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border)}
  .brand{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .tabs{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
  .tabs button{font:600 13px 'Inter',sans-serif;border:none;background:transparent;color:var(--text-2);padding:8px 20px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(20,21,26,.12)}
  :is(button):focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .sp{flex:1}
  .themebtn{position:relative;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center}
  .themebtn:hover{border-color:var(--brand);color:var(--brand)}
  .themebtn .ic{grid-area:1/1;width:20px;height:20px;transition:transform var(--dur) cubic-bezier(.16,1,.3,1),opacity var(--dur) ease}
  .ic-moon{opacity:1;transform:none}.ic-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
  :root[data-theme="dark"] .ic-sun{opacity:1;transform:none}
  :root[data-theme="dark"] .ic-moon{opacity:0;transform:rotate(90deg) scale(.4)}
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  ::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}

  .stage{position:relative;flex:1;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
  .stage iframe.on{display:block}
  .load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px;color:var(--text-2);font-size:13px;background:var(--bg);z-index:2}
  .load.on{display:flex}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--brand);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{padding:60px 20px;text-align:center;color:var(--text-2);font-size:14px}
  @media (max-width:640px){.bar{padding:8px 12px;gap:8px}.brand{display:none}.tabs button{padding:8px 16px}}
  .gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
  .gate.on{display:flex}
  .gate form{width:100%;max-width:340px}
  .gate h1{font-size:20px;font-weight:700;margin:0 0 2px}
  .gate p{font-size:13px;color:var(--text-2);margin:0 0 16px}
  .gate input{width:100%;height:40px;font-size:14px;font-family:inherit;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:0 12px;background:var(--card)}
  .gate input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .gate .go{width:100%;height:40px;margin-top:12px;font:600 13.5px 'Inter',sans-serif;border-radius:999px;border:none;cursor:pointer;background:var(--brand);color:var(--bg)}
  .gate .go:disabled{opacity:.6;cursor:wait}
  .gate .msg{min-height:18px;margin:10px 0 0;font-size:13px;color:#c0392b}
  .lock{font:600 12.5px 'Inter',sans-serif;border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:999px;height:40px;padding:0 14px;cursor:pointer}
  .lock:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Laporan Elitech</div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Halaman"></nav>
  <div class="sp"></div>
  <button class="lock" id="btnKunci" type="button">Kunci</button>
  <button class="themebtn" id="btnTema" type="button" aria-label="Ganti mode gelap/terang" title="Ganti mode gelap/terang">
    <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Laporan Elitech</h1>
    <p>Masukkan kata kunci untuk membuka laporan.</p>
    <input type="password" id="gateKey" placeholder="Kata kunci" aria-label="Kata kunci" autocomplete="current-password">
    <button class="go" id="gateGo" type="submit">Buka</button>
    <div class="msg" id="gateMsg" role="alert"></div>
  </form>
</div>
<main class="stage" id="stage"><div class="load" id="load"><span class="spin"></span> Memuat halaman...</div></main>

<script>
  /* ====== DAFTAR HALAMAN: tambah satu baris untuk menambah tab ====== */
  var PAGES = [
    { id: 'penjualan', label: 'Penjualan', url: 'https://markom-sudo.github.io/Populasi/laporan.html' },
    { id: 'tender',    label: 'Tender',    url: 'https://markom-sudo.github.io/tenderness/' }
  ];
  /* CSS yang disuntikkan ke halaman di dalam frame: tombol tema bawaan disembunyikan, karena tema diatur dari sini */
  var CSS_ANAK = '.themebtn{display:none !important;}';

  var $ = function (id) { return document.getElementById(id); };
  var frames = {}, aktif = null;

  function tema() { return document.documentElement.getAttribute('data-theme'); }
  function setAnak(f, t) {                       // halaman anak satu domain: panggil langsung; kalau gagal pakai pesan
    try { f.contentWindow.__setTheme(t); }
    catch (e) { try { f.contentWindow.postMessage({ __elitech: 'theme', theme: t }, '*'); } catch (e2) {} }
  }
  function terapkanTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    Object.keys(frames).forEach(function (k) { setAnak(frames[k], t); });
  }

  function buatFrame(p) {
    var f = document.createElement('iframe');
    f.title = p.label; f.dataset.id = p.id;
    f.addEventListener('load', function () {
      try { var s = f.contentDocument.createElement('style'); s.textContent = CSS_ANAK; f.contentDocument.head.appendChild(s); } catch (e) {}
      setAnak(f, tema());
      if (aktif === p.id) $('load').classList.remove('on');
      f.dataset.ready = '1';
    });
    f.src = p.url;
    $('stage').appendChild(f); frames[p.id] = f;
  }

  function pilih(id, tanpaHash) {
    var p = PAGES.filter(function (x) { return x.id === id; })[0] || PAGES[0];
    aktif = p.id;
    if (!frames[p.id]) buatFrame(p);
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === p.id); });
    $('load').classList.toggle('on', !frames[p.id].dataset.ready);
    [].forEach.call($('tabs').children, function (b) { var on = b.dataset.id === p.id; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    document.title = p.label + ' | Laporan Elitech';
    if (!tanpaHash && location.hash !== '#' + p.id) history.pushState(null, '', '#' + p.id);
  }

  PAGES.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = p.id; b.textContent = p.label;
    b.addEventListener('click', function () { pilih(p.id); }); $('tabs').appendChild(b);
  });
  window.addEventListener('hashchange', function () { pilih(location.hash.slice(1), true); });

  $('btnTema').addEventListener('click', function (e) {
    var rc = e.currentTarget.getBoundingClientRect(), x = rc.left + rc.width / 2, y = rc.top + rc.height / 2;
    var t = tema() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('elitech_theme', t); } catch (er) {}
    var apply = function () { terapkanTema(t); };
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }
    var r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(function () {
      document.documentElement.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + r + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 1000, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' });
    });
  });

  /* ====== KATA KUNCI ======
     Yang disimpan hanya hash SHA-256 (bukan katanya). Ini penghalang untuk orang biasa, bukan pengaman penuh:
     halaman dan data di GitHub Pages tetap bisa dibuka orang yang tahu alamat aslinya. */
  var KUNCI_HASH = 'e9613043a8c6f174683538ad85bac58cbf5f81fc91513f5d1aa093119ec6f952';
  async function sha(t) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return Array.prototype.map.call(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }
  function bukaKunci() { try { return sessionStorage.getItem('portal_ok') === KUNCI_HASH; } catch (e) { return false; } }
  function mulai() { $('gate').classList.remove('on'); pilih(location.hash.slice(1), true); }
  function tampilGate() { $('gate').classList.add('on'); $('gateKey').value = ''; $('gateKey').focus(); }
  $('gateForm').addEventListener('submit', async function (e) {
    e.preventDefault(); var go = $('gateGo'); go.disabled = true; $('gateMsg').textContent = '';
    var ok = false;
    try { ok = (await sha($('gateKey').value.trim())) === KUNCI_HASH; } catch (er) { $('gateMsg').textContent = 'Browser ini tidak mendukung pengecekan kata kunci.'; go.disabled = false; return; }
    if (ok) { try { sessionStorage.setItem('portal_ok', KUNCI_HASH); } catch (er) {} go.disabled = false; mulai(); }
    else { setTimeout(function () { $('gateMsg').textContent = 'Kata kunci salah.'; $('gateKey').select(); go.disabled = false; }, 800); }
  });
  $('btnKunci').addEventListener('click', function () {
    try { sessionStorage.removeItem('portal_ok'); } catch (e) {}
    Object.keys(frames).forEach(function (k) { frames[k].remove(); delete frames[k]; });
    tampilGate();
  });
  if (bukaKunci()) mulai(); else tampilGate();
</script>
</body>
</html>
